name: Build debug APK

# Produces an installable APK without needing Android Studio or an Android SDK
# on your own computer. Push this folder to a GitHub repo, run the workflow,
# then download the "blocker-night-guard-apk" artifact.
#
# The build itself uses the Gradle installed by setup-gradle directly, so it
# does NOT depend on gradle-wrapper.jar being present in the repository.
# A second artifact contains the whole project WITH a freshly generated
# wrapper, so you can also open it straight away in Android Studio.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Gradle wrapper (for local use)
        continue-on-error: true
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x ./gradlew

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blocker-night-guard-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Package complete project with wrapper
        run: |
          zip -r blocker-project-with-wrapper.zip . \
            -x '.git/*' 'app/build/*' '.gradle/*' 'build/*' '*.zip'

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: blocker-project-with-wrapper
          path: blocker-project-with-wrapper.zip
          if-no-files-found: warn
